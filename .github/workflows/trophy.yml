name: GitHub Trophy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - uses: ryo-ma/github-profile-trophy@master
        with:
          username: Iftekharul778
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: radical      # ফায়ার ও নিয়ন লুকের জন্য সঠিক থিম
          no-frame: true      # সাদা বক্স ও বর্ডার সরিয়ে দেবে
          column: 4           # ২ সারিতে ৪টি করে সুন্দরভাবে সাজাবে

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix trophy theme to radical" || exit 0
          git push
