name: GitHub Trophy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - uses: ryo-ma/github-profile-trophy@master
        with:
          username: Iftekharul778
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: fire        # ফায়ার বা জ্বলন্ত থিম ব্যবহার করা হয়েছে
          no-frame: true      # ট্রফিগুলোর চারপাশের বর্ডার সরিয়ে দেবে
          column: 4           # প্রতি লাইনে ৪টি করে সাজাবে

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update trophies to fire theme" || exit 0
          git push
